name: Build

# Worbus P4 (design §6.9): Android only. Pull requests and branch pushes build a debug APK; a `v*`
# tag builds a signed release APK and attaches it to a DRAFT release on this fork. The signed job is
# inert until the four signing secrets exist (KEYSTORE, KEY_ALIAS, KEY_PASSWORD, KEYSTORE_PASSWORD):
# it says so in the log and stops green, and releases stay workstation-built until then.
# Nothing here publishes anywhere but this fork.

on:
  push:
    paths:
      - androidApp/**
      - composeApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/build.yml
      - "!**/strings.xml"
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
    paths:
      - androidApp/**
      - composeApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: Android (debug)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (debug)
        run: |
          ./gradlew :androidApp:assembleDebug --stacktrace
          mv androidApp/build/outputs/apk/debug/*.apk ./

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: navic-debug-android
          path: ./*.apk
          compression-level: 0
          if-no-files-found: error

  release:
    name: Android (signed release)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'illuminator69/navic-gaps' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A job's `if:` cannot read `secrets`, so the check is a step whose output gates the rest.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The four signing secrets are not all set; no signed release is built. Releases stay workstation-built."
          fi

      - name: Checkout repository
        if: steps.signing.outputs.ok == 'true'
        uses: actions/checkout@v6

      - name: Setup JDK
        if: steps.signing.outputs.ok == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        if: steps.signing.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (signed release)
        if: steps.signing.outputs.ok == 'true'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          trap 'rm -f release.keystore' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > release.keystore
          ./gradlew :androidApp:assembleRelease --stacktrace
          mv androidApp/build/outputs/apk/release/Navic.apk "./Navic-${GITHUB_REF_NAME}.apk"

      - name: Create draft release on this fork
        if: steps.signing.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "./Navic-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft --generate-notes
