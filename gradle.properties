# Gradle
#
# HEAP: upstream ships -Xmx8g -Xms8g here AND the same on kotlin.daemon.jvmargs
# below. `-Xms` is PRE-ALLOCATED, so those two daemons reserve 16 GB between them
# before compiling anything — which is more RAM than this workstation has (15.3 GB)
# and took the whole machine down on 2026-09-22.
#
# So: no -Xms at all (let the heap grow only as needed), and ceilings that cannot
# overcommit together. 4g + 3g = 7g worst case, leaving the OS ~8g. Measured on a
# full :androidApp:assembleRelease including R8: it not only fits, it is FASTER
# than the 8g+8g configuration (1m58s), because the machine stops swapping.
#
# Raise these only on a machine with the RAM to back them, and never reintroduce
# -Xms.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Xmx4g
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
kotlin.suppressGradlePluginWarnings=NonKmpAgpIsDeprecated
kotlin.incremental.native=true
kotlin.native.binary.smallBinary=true
kotlin.native.ignoreDisabledTargets=true
# See the heap note under org.gradle.jvmargs: no -Xms, and a ceiling that cannot
# overcommit alongside the Gradle daemon's.
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Xmx3g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
